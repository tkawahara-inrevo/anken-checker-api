<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>案件チェッカー（社内用）</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Meiryo', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 36px 32px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .badge {
      display: inline-block;
      background: #fff3cd;
      color: #856404;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }
    h1 { font-size: 20px; color: #1a1a2e; margin-bottom: 4px; }
    .subtitle { color: #888; font-size: 13px; margin-bottom: 28px; }
    label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 600; }
    input {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px;
      margin-bottom: 14px;
      transition: border-color 0.2s;
      color: #1a1a2e;
    }
    input:focus { outline: none; border-color: #e67e22; }
    button {
      width: 100%;
      padding: 14px;
      background: #e67e22;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #ca6f1e; }
    button:disabled { background: #c0c0c0; cursor: not-allowed; }
    .result {
      margin-top: 18px;
      padding: 16px 18px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.7;
    }
    .result.ng { background: #fff5f5; border-left: 4px solid #e53e3e; color: #742a2a; }
    .result.ok { background: #f0fff4; border-left: 4px solid #38a169; color: #1a4731; }
    .result .tag {
      display: inline-block;
      background: rgba(0,0,0,0.08);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 12px;
      margin-bottom: 6px;
      font-weight: 700;
    }
    .loading { color: #888; font-size: 13px; margin-top: 12px; display: flex; align-items: center; gap: 8px; }
    .loading::before { content: ''; display: inline-block; width: 14px; height: 14px; border: 2px solid #ccc; border-top-color: #e67e22; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .reset { display: block; text-align: center; color: #aaa; font-size: 12px; cursor: pointer; margin-top: 16px; text-decoration: underline; }
    .reset:hover { color: #666; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">INREVO 社内用</div>
    <h1>案件チェッカー</h1>
    <p class="subtitle">提案前に既得権・商談状況を確認します</p>

    <label>クライアント企業名</label>
    <input type="text" id="companyName" placeholder="例：株式会社〇〇" />
    <button id="checkBtn" onclick="checkCompany()">確認する</button>
    <div id="loading" class="loading" style="display:none">確認中...</div>
    <div id="result"></div>
    <span class="reset" id="resetBtn" onclick="reset()" style="display:none">クリア</span>
  </div>

  <script>
    async function checkCompany() {
      const name = document.getElementById('companyName').value.trim();
      if (!name) { alert('企業名を入力してください'); return; }

      document.getElementById('loading').style.display = 'flex';
      document.getElementById('result').innerHTML = '';
      document.getElementById('resetBtn').style.display = 'none';
      document.getElementById('checkBtn').disabled = true;

      try {
        const res = await fetch('/api/inrevo-check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ company_name: name })
        });
        const data = await res.json();
        document.getElementById('loading').style.display = 'none';
        document.getElementById('checkBtn').disabled = false;
        document.getElementById('resetBtn').style.display = 'block';

        if (data.error) {
          show('ng', 'エラー', data.error);
          return;
        }

        if (data.result === 'available') {
          show('ok', '提案可能', `<strong>${name}</strong> は提案可能です。`);
          return;
        }

        const reasons = {
          hitotore: `<strong>${name}</strong> はヒトトレ受注済みです。提案できません。`,
          inrevo_pursuit: `<strong>${name}</strong> はINREVO商談中です（ヨミ：${data.yomi}）。`,
          first_meeting: `<strong>${name}</strong> は初回商談済みです。<br>保護期間：${data.expiry_date} まで（初回商談日：${data.meeting_date}）`,
          agent_rights: `<strong>${name}</strong> は代理店の既得権があります。<br>保護期限：${data.deadline} まで`
        };

        const labels = {
          hitotore: 'ヒトトレ受注',
          inrevo_pursuit: 'INREVO商談中',
          first_meeting: '初回商談保護期間',
          agent_rights: '代理店既得権'
        };

        show('ng', labels[data.reason] || 'ブロック', reasons[data.reason] || '提案不可');
      } catch (e) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('checkBtn').disabled = false;
        show('ng', 'エラー', '通信エラーが発生しました。再度お試しください。');
      }
    }

    function show(type, label, html) {
      document.getElementById('result').innerHTML =
        `<div class="result ${type}"><span class="tag">${label}</span><br>${html}</div>`;
    }

    function reset() {
      document.getElementById('companyName').value = '';
      document.getElementById('result').innerHTML = '';
      document.getElementById('resetBtn').style.display = 'none';
    }

    document.getElementById('companyName').addEventListener('keydown', e => {
      if (e.key === 'Enter') checkCompany();
    });
  </script>
</body>
</html>
